# Map Cloudflare visitor scheme to detect plain-HTTP end-user requests.
# Works regardless of Cloudflare->origin transport (Flexible/Full) because
# CF-Visitor reflects the *client's* scheme, not the edge->origin connection.
map $http_cf_visitor $cf_is_http {
    default             0;
    '{"scheme":"http"}' 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rec 1 (part A): redirect end-user HTTP visits to HTTPS.
    if ($cf_is_http) {
        return 301 https://$host$request_uri;
    }

    # ---- Security & performance headers ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Rec 1 (part B): HSTS. Browsers only honor it over HTTPS; safe to send always.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Rec 5: Content-Security-Policy.
    # Allows: same-origin scripts (script.js + Cloudflare email-decode at /cdn-cgi/),
    # Google Fonts (CSS + font files), self-hosted images, no third-party frames/objects.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.google-analytics.com https://*.google-analytics.com https://static.cloudflareinsights.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://formspree.io https://*.formspree.io; object-src 'none'" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied any;

    # Assets: cache aggressively
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Rec 3: sitemap.xml served with explicit XML content-type + light cache
    location = /sitemap.xml {
        types { application/xml xml; }
        default_type application/xml;
        expires 1d;
        try_files $uri =404;
    }

    # Self-hosted visitor counter (same-origin, privacy-friendly — no 3rd party)
    location /api/visits {
        proxy_pass http://127.0.0.1:8081/visits;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    # SPA-style fallback to index for unknown routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}

# Rec 2 (part A): canonical host — redirect www to apex (also upgrades to HTTPS)
server {
    listen 80;
    server_name www.crs.web.id;
    return 301 https://crs.web.id$request_uri;
}
